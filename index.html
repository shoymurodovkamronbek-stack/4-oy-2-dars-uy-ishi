<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO do list</title>
     <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --muted-color: #94a3b8;
      --primary-color: #3b82f6;
      --danger-color: #ef4444;
      --border-color: #334155;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .todo-container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 480px;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      font-size: 24px;
      letter-spacing: 0.5px;
    }
    .input-group, .filter-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #0f172a;
      color: var(--text-color);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--primary-color);
    }
    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background-color: var(--primary-color);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    .filter-group button {
      flex: 1;
      background-color: #334155;
      font-size: 12px;
      padding: 8px;
    }
    .filter-group button:hover {
      background-color: #475569;
    }
    .clear-btn {
      background-color: var(--danger-color) !important;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 280px;
      overflow-y: auto;
    }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      margin-bottom: 8px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      gap: 10px;
      transition: background-color 0.2s;
    }
    li:hover {
      background-color: rgba(255, 255, 255, 0.06);
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .title {
      font-size: 14px;
      word-break: break-word;
    }
    .completed {
      text-decoration: line-through;
      color: var(--muted-color);
    }
    .date-text {
      font-size: 11px;
      color: var(--muted-color);
      display: block;
    }
    .action-buttons {
      display: flex;
      gap: 5px;
    }
    .action-buttons button {
      padding: 5px 10px;
      font-size: 11px;
    }
    .edit-btn {
      background-color: #eab308;
    }
    .delete-btn {
      background-color: var(--danger-color);
    }
    .empty-message {
      text-align: center;
      color: var(--muted-color);
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
    <div class="todo-container">
        <h2>My to do list</h2>
        <div class="input-group">
            <input type="text" id="todoInput" placeholder="Yangi vazifa kiriting..." onkeydown="handleKeyPress(event)">
            <button onclick="addTodo()">Add+</button>
        </div>
        <div class="input-group">
            <input type="text" id="searchInput" placeholder="Qidirish..." oninput="renderTodos()">
        </div>
        <div class="filter-group">
            <button data-filter="all" onclick="setFilter('all')">All</button>
            <button data-filter="active" onclick="setFilter('active')">Active</button>
            <button data-filter="completed" onclick="setFilter('completed')">Completed</button>
            <button class="clear-btn" onclick="clearAll()">Clear all</button>
        </div>

        <ul id="todoList"></ul>
    </div>
    <script src="./index.js"></script>
</body>
</html>
